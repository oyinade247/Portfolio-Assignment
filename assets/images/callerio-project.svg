<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="callerioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="peerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#callerioBg)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="600" height="44" rx="16" fill="#020617" opacity="0.7"/>
  <circle cx="24" cy="22" r="6" fill="#fb7185"/>
  <circle cx="44" cy="22" r="6" fill="#fbbf24"/>
  <circle cx="64" cy="22" r="6" fill="#34d399"/>
  <text x="90" y="27" font-family="sans-serif" font-size="13" fill="#ffffff" font-weight="bold">📹 Callerio • Video Calls</text>
  <rect x="440" y="11" width="140" height="24" rx="12" fill="#22c55e" opacity="0.2"/>
  <circle cx="452" cy="23" r="4" fill="#22c55e"/>
  <text x="462" y="27" font-family="monospace" font-size="11" fill="#4ade80" font-weight="bold">LIVE: 24:18</text>

  <!-- Video Grid -->
  <!-- Stream 1 (Peer) -->
  <rect x="24" y="58" width="266" height="240" rx="12" fill="url(#peerGrad)"/>
  <circle cx="157" cy="160" r="45" fill="#0c4a6e" opacity="0.6"/>
  <text x="142" y="172" font-family="sans-serif" font-size="32" fill="#ffffff">👨🏾‍💻</text>
  <rect x="36" y="260" width="140" height="26" rx="6" fill="#0f172a" opacity="0.8"/>
  <text x="46" y="278" font-family="sans-serif" font-size="12" fill="#ffffff" font-weight="600">Prof. Emmanuel</text>

  <!-- Stream 2 (Favour / User) -->
  <rect x="310" y="58" width="266" height="240" rx="12" fill="url(#userGrad)"/>
  <circle cx="443" cy="160" r="45" fill="#831843" opacity="0.6"/>
  <text x="428" y="172" font-family="sans-serif" font-size="32" fill="#ffffff">👩🏾‍💻</text>
  <rect x="322" y="260" width="150" height="26" rx="6" fill="#0f172a" opacity="0.8"/>
  <text x="332" y="278" font-family="sans-serif" font-size="12" fill="#ffffff" font-weight="600">Favour Adedokun (You)</text>

  <!-- Call Control Bar -->
  <rect x="170" y="312" width="260" height="52" rx="26" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Mic button -->
  <circle cx="210" cy="338" r="18" fill="#334155"/>
  <text x="202" y="343" font-size="14">🎤</text>

  <!-- Cam button -->
  <circle cx="260" cy="338" r="18" fill="#334155"/>
  <text x="252" y="343" font-size="14">📷</text>

  <!-- Screen share button -->
  <circle cx="310" cy="338" r="18" fill="#334155"/>
  <text x="302" y="343" font-size="14">💻</text>

  <!-- End call button -->
  <circle cx="380" cy="338" r="20" fill="#ef4444"/>
  <text x="372" y="343" font-size="14">📞</text>
</svg>