<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="dashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="12" fill="url(#dashGrad)"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="600" height="44" rx="12" fill="#1e293b"/>
  <circle cx="25" cy="22" r="6" fill="#ef4444"/>
  <circle cx="45" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="22" r="6" fill="#10b981"/>
  <text x="90" y="26" font-family="monospace" font-size="13" fill="#94a3b8">miva-cgpa-calculator.web.app</text>

  <!-- Metric Card -->
  <rect x="30" y="65" width="250" height="110" rx="8" fill="#334155" opacity="0.7" stroke="#475569" stroke-width="1"/>
  <text x="48" y="95" font-family="sans-serif" font-size="13" fill="#94a3b8" font-weight="600">CUMULATIVE CGPA</text>
  <text x="48" y="145" font-family="sans-serif" font-size="42" fill="#38bdf8" font-weight="bold">4.82<tspan font-size="18" fill="#94a3b8"> / 5.00</tspan></text>
  <rect x="48" y="156" width="120" height="6" rx="3" fill="url(#accentGrad)"/>

  <!-- Standing Badge -->
  <rect x="300" y="65" width="270" height="110" rx="8" fill="#334155" opacity="0.7" stroke="#475569" stroke-width="1"/>
  <text x="320" y="95" font-family="sans-serif" font-size="13" fill="#94a3b8" font-weight="600">ACADEMIC HONORS</text>
  <text x="320" y="132" font-family="sans-serif" font-size="22" fill="#4ade80" font-weight="bold">First Class Standing</text>
  <text x="320" y="155" font-family="sans-serif" font-size="12" fill="#cbd5e1">Completed Credits: 21 Units</text>

  <!-- Table preview -->
  <rect x="30" y="195" width="540" height="160" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="30" y="195" width="540" height="34" fill="#334155"/>
  <text x="48" y="217" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Course Code</text>
  <text x="170" y="217" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Course Title</text>
  <text x="380" y="217" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Credit Units</text>
  <text x="490" y="217" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Grade</text>

  <text x="48" y="255" font-family="sans-serif" font-size="12" fill="#e2e8f0">COS 106</text>
  <text x="170" y="255" font-family="sans-serif" font-size="12" fill="#cbd5e1">Introduction to Web Technologies</text>
  <text x="410" y="255" font-family="sans-serif" font-size="12" fill="#cbd5e1">3</text>
  <text x="500" y="255" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4ade80">A (5.0)</text>

  <line x1="30" y1="272" x2="570" y2="272" stroke="#334155"/>

  <text x="48" y="298" font-family="sans-serif" font-size="12" fill="#e2e8f0">COS 101</text>
  <text x="170" y="298" font-family="sans-serif" font-size="12" fill="#cbd5e1">Introduction to Computing</text>
  <text x="410" y="298" font-family="sans-serif" font-size="12" fill="#cbd5e1">3</text>
  <text x="500" y="298" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4ade80">A (5.0)</text>

  <line x1="30" y1="315" x2="570" y2="315" stroke="#334155"/>

  <text x="48" y="340" font-family="sans-serif" font-size="12" fill="#e2e8f0">MTH 101</text>
  <text x="170" y="340" font-family="sans-serif" font-size="12" fill="#cbd5e1">Elementary Mathematics I</text>
  <text x="410" y="340" font-family="sans-serif" font-size="12" fill="#cbd5e1">3</text>
  <text x="500" y="340" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4ade80">A (5.0)</text>
