<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="girlyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="blouseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d5524"/>
      <stop offset="100%" stop-color="#603410"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#f43f5e" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle with Soft Pink/Lilac Gradient -->
  <circle cx="200" cy="200" r="190" fill="url(#girlyBg)"/>
  <circle cx="200" cy="200" r="184" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.8"/>

  <!-- Floating sparkles & flowers -->
  <text x="60" y="100" font-size="24">✨</text>
  <text x="320" y="90" font-size="22">🌸</text>
  <text x="50" y="290" font-size="20">💖</text>
  <text x="330" y="260" font-size="22">🎀</text>

  <!-- Shoulders & Blouse -->
  <path d="M85 390 C 95 300, 140 265, 200 265 C 260 265, 305 300, 315 390 Z" fill="url(#blouseGrad)" filter="url(#glow)"/>
  
  <!-- Blouse detail / collar -->
  <path d="M175 265 C 190 290, 210 290, 225 265" stroke="#ffffff" stroke-width="4" fill="#fff1f2"/>
  <!-- Cute necklace with gold pendant -->
  <path d="M178 245 Q200 265 222 245" stroke="#fbbf24" stroke-width="2.5" fill="none"/>
  <circle cx="200" cy="256" r="4" fill="#f59e0b"/>

  <!-- Neck -->
  <path d="M180 205 L220 205 L220 255 L180 255 Z" fill="url(#skinGrad)"/>

  <!-- Long Hair (Back) -->
  <path d="M125 160 C 115 240, 120 330, 150 360 C 130 310, 130 220, 145 170 Z" fill="#1c1917"/>
  <path d="M275 160 C 285 240, 280 330, 250 360 C 270 310, 270 220, 255 170 Z" fill="#1c1917"/>

  <!-- Head -->
  <ellipse cx="200" cy="172" rx="54" ry="66" fill="url(#skinGrad)"/>

  <!-- Ears & Gold Earrings -->
  <ellipse cx="146" cy="175" rx="9" ry="14" fill="url(#skinGrad)"/>
  <ellipse cx="254" cy="175" rx="9" ry="14" fill="url(#skinGrad)"/>
  <circle cx="145" cy="185" r="4" fill="#fbbf24"/>
  <circle cx="255" cy="185" r="4" fill="#fbbf24"/>

  <!-- Hair (Front/Braid/Curls) -->
  <path d="M140 160 C 135 100, 165 82, 200 82 C 235 82, 265 100, 260 160 C 250 108, 230 96, 200 96 C 170 96, 150 108, 140 160 Z" fill="#1c1917"/>
  <!-- Cute hair puff / styled waves -->
  <ellipse cx="200" cy="86" rx="45" ry="22" fill="#1c1917"/>
  <ellipse cx="160" cy="98" rx="25" ry="18" fill="#1c1917"/>
  <ellipse cx="240" cy="98" rx="25" ry="18" fill="#1c1917"/>
  <!-- Cute hair clip / barrette -->
  <rect x="235" y="115" width="24" height="8" rx="4" fill="#f43f5e" transform="rotate(-15 235 115)"/>
  <circle cx="234" cy="116" r="5" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M168 152 Q180 146 192 152" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M208 152 Q220 146 232 152" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Eyes with sweet lashes -->
  <ellipse cx="180" cy="166" rx="5" ry="5" fill="#1c1917"/>
  <ellipse cx="220" cy="166" rx="5" ry="5" fill="#1c1917"/>
  <!-- Eye highlights -->
  <circle cx="182" cy="164" r="2" fill="#ffffff"/>
  <circle cx="222" cy="164" r="2" fill="#ffffff"/>
  <!-- Eyelashes -->
  <path d="M174 163 L170 160" stroke="#1c1917" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M186 163 L190 160" stroke="#1c1917" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M214 163 L210 160" stroke="#1c1917" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M226 163 L230 160" stroke="#1c1917" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Cheeks Blush -->
  <ellipse cx="168" cy="180" rx="9" ry="6" fill="#f43f5e" opacity="0.4"/>
  <ellipse cx="232" cy="180" rx="9" ry="6" fill="#f43f5e" opacity="0.4"/>

  <!-- Cute Nose -->
  <path d="M200 172 Q197 184 196 186 Q200 188 204 186" stroke="#4a2505" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Pretty Rosy Smile with gloss -->
  <path d="M186 200 Q200 215 214 200" stroke="#9f1239" stroke-width="2" fill="#f43f5e"/>
  <path d="M190 200 Q200 208 210 200" fill="#ffffff"/>

  <!-- Stylish Glasses (Rose Gold / Cat-Eye style) -->
  <path d="M160 156 Q180 154 195 162 Q192 178 175 178 Q160 176 160 156 Z" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
  <path d="M205 162 Q220 154 240 156 Q240 176 225 178 Q208 178 205 162 Z" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
  <line x1="195" y1="163" x2="205" y2="163" stroke="#f43f5e" stroke-width="2"/>

  <!-- Floating Student Badge Overlay -->
  <g transform="translate(210, 310)">
    <rect width="170" height="38" rx="19" fill="#ffffff" stroke="#fda4af" stroke-width="2" filter="url(#glow)"/>
    <text x="20" y="24" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e11d48">🌸 Favour • SE @ MIVA</text>
  </g>
</svg>